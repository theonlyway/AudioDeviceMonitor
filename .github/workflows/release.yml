name: Release

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths-ignore:
            - ".github/**"
            - "README.md"
            - "CONTRIBUTING.md"

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    semver:
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            current_version: ${{ steps.semver.outputs.current }}
            next_version: ${{ steps.semver.outputs.nextStrict }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get Next Version
              id: semver
              uses: ietf-tools/semver-action@v1
              with:
                  token: ${{ github.token }}
                  branch: main
                  patchAll: true
                  majorList: "breaking,major"

    build:
        name: Build Binary
        runs-on: windows-latest
        needs: [semver]
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5

            - name: Download dependencies
              run: go mod download

            - name: Build binary
              run: |
                  go build -v -ldflags="-s -w -X main.Version=${{ needs.semver.outputs.next_version }}" -o bin/audio-monitor.exe ./cmd/audio-monitor

            - name: Compress binary
              run: |
                  Compress-Archive -Path bin/audio-monitor.exe -DestinationPath bin/audio-monitor-windows-amd64.zip

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: binaries
                  path: |
                      bin/audio-monitor.exe
                      bin/audio-monitor-windows-amd64.zip

    release:
        name: Create Release
        runs-on: ubuntu-latest
        needs: [semver, build]
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: binaries
                  path: ./bin

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  name: Release ${{ needs.semver.outputs.next_version }}
                  tag_name: ${{ needs.semver.outputs.next_version }}
                  body: |
                      ## 📦 Download

                      Download the `audio-monitor-windows-amd64.zip` file, extract it, and see the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for installation and usage instructions.
                  files: |
                      bin/audio-monitor-windows-amd64.zip

    changelog:
        name: Update Changelog
        runs-on: ubuntu-latest
        needs: [semver, release]
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 0

            - name: Update CHANGELOG
              id: changelog
              uses: requarks/changelog-action@v1
              with:
                  token: ${{ github.token }}
                  tag: ${{ needs.semver.outputs.next_version }}

            - name: Update Release with Changelog
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.semver.outputs.next_version }}
                  body: ${{ steps.changelog.outputs.changes }}
                  append_body: true

            - name: Commit CHANGELOG.md
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  branch: main
                  commit_message: "docs: update CHANGELOG.md for ${{ needs.semver.outputs.next_version }} [skip ci]"
                  file_pattern: CHANGELOG.md
