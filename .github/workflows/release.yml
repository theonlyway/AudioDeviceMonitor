name: Release

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths-ignore:
            - ".github/**"
            - "README.md"
            - "CONTRIBUTING.md"

concurrency:
    group: release
    cancel-in-progress: true

jobs:
    semver:
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            current_version: ${{ steps.semver.outputs.current }}
            next_version: ${{ steps.semver.outputs.nextStrict }}
        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0

            - name: Get Next Version
              id: semver
              uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
              with:
                  token: ${{ github.token }}
                  branch: main
                  patchAll: true
                  majorList: "breaking,major"
                  fallbackTag: "0.0.0"
                  noVersionBumpBehavior: "current"
                  noNewCommitBehavior: "current"
                  prefix: ""

    build:
        name: Build Binary
        runs-on: windows-latest
        needs: [semver]
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
              with:
                  go-version-file: go.mod

            - name: Download dependencies
              run: go mod download

            - name: Build binary
              run: |
                  go build -v -ldflags="-s -w -H=windowsgui -X main.Version=${{ needs.semver.outputs.next_version }}" -o bin/audio-monitor.exe ./cmd/audio-monitor

            - name: Compress binary
              run: |
                  Compress-Archive -Path bin/audio-monitor.exe -DestinationPath bin/audio-monitor-windows-amd64.zip

            - name: Upload artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: binaries
                  path: |
                      bin/audio-monitor.exe
                      bin/audio-monitor-windows-amd64.zip

    release:
        name: Create Release
        runs-on: ubuntu-latest
        needs: [semver, build]
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0

            - name: Download artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: binaries
                  path: ./bin

            - name: Create Release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  name: ${{ needs.semver.outputs.next_version }}
                  tag_name: ${{ needs.semver.outputs.next_version }}
                  body: |
                      ## 📦 Download

                      Download the `audio-monitor-windows-amd64.zip` file, extract it, and see the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for installation and usage instructions.
                  files: |
                      bin/audio-monitor-windows-amd64.zip

    changelog:
        name: Update Changelog
        runs-on: ubuntu-latest
        needs: [semver, release]
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  ref: main
                  fetch-depth: 0

            - name: Update CHANGELOG
              id: changelog
              uses: requarks/changelog-action@b78a3354a01f4a1affb484b9264b506a815c46b1 # v1
              with:
                  token: ${{ github.token }}
                  tag: ${{ needs.semver.outputs.next_version }}

            - name: Update Release with Changelog
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  tag_name: ${{ needs.semver.outputs.next_version }}
                  body: ${{ steps.changelog.outputs.changes }}
                  append_body: true

            - name: Commit CHANGELOG.md
              uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
              with:
                  branch: main
                  commit_message: "docs: update CHANGELOG.md for ${{ needs.semver.outputs.next_version }} [skip ci]"
                  file_pattern: CHANGELOG.md
